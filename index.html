<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>After Class — SFSU Office Hours</title>

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
  box-sizing: border-box;
  font-family: "Times New Roman", Times, serif;
}

html {
  font-size: 12pt;
}

:root {
  --purple: #6a2c91;
  --dark-purple: #4e1d70;
  --light-purple: #eee4f5;
  --pink: #e91e63;
  --green: #278a55;
  --red: #d94a4a;
  --black: #111;
  --gray: #666;
  --light-gray: #f5f5f5;
  --border: #dedede;
  --white: #fff;
}

body {
  margin: 0;
  background: #fafafa;
  color: var(--black);
  overflow-x: hidden;
}

/* =========================================================
   HEADER
   ========================================================= */

header {
  height: 74px;
  background: white;
  border-bottom: 1px solid #ddd;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 34px;

  position: relative;
  z-index: 20;
}

.logo {
  display: flex;
  align-items: center;
  gap: 13px;

  cursor: pointer;
  user-select: none;
}

.logo-mark {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  background: var(--purple);
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 20px;
  font-weight: bold;
}

.logo-text {
  font-size: 21px;
  font-weight: bold;
  letter-spacing: -0.3px;
}

.logo-sub {
  color: #777;
  font-size: 14px;
  margin-left: 3px;
}

.sfsu-link {
  font-size: 15px;
  font-weight: bold;
  color: var(--purple);
  text-decoration: none;

  cursor: pointer;
}

.sfsu-link:hover {
  text-decoration: underline;
}

/* =========================================================
   MAIN
   ========================================================= */

main {
  min-height: calc(100vh - 74px);

  display: flex;
  flex-direction: column;
  align-items: center;

  padding-top: 28px;
}

/* =========================================================
   TOP AREA
   ========================================================= */

.top-line {
  width: min(420px, calc(100vw - 40px));

  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 12px;
}

.title {
  font-size: 14px;
  font-weight: bold;
  color: #555;
}

.counter {
  font-size: 13px;
  color: #777;
}

/* =========================================================
   CARD DECK
   ========================================================= */

.deck {
  position: relative;

  width: min(420px, calc(100vw - 40px));
  height: 590px;
}

.card {
  position: absolute;

  width: 100%;
  height: 100%;

  background: white;

  border: 1px solid #ddd;
  border-radius: 18px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);

  overflow: hidden;

  user-select: none;
  touch-action: none;

  cursor: grab;

  transition:
    transform 0.25s ease,
    opacity 0.25s ease;
}

.card:active {
  cursor: grabbing;
}

.card.next-preview {
  transform: scale(0.96) translateY(10px);
  opacity: 0.35;
  z-index: 1;
}

.card.current {
  z-index: 5;
}

/* =========================================================
   PHOTO
   ========================================================= */

.photo-container {
  height: 310px;
  width: 100%;

  background: #eee;

  position: relative;
  overflow: hidden;
}

.photo {
  width: 100%;
  height: 100%;

  object-fit: cover;

  pointer-events: none;
}

/* =========================================================
   STAMPS
   ========================================================= */

.stamp {
  position: absolute;

  top: 28px;

  padding: 8px 16px;

  border: 4px solid;

  border-radius: 8px;

  font-size: 22px;
  font-weight: bold;

  letter-spacing: 1px;

  opacity: 0;

  z-index: 10;

  pointer-events: none;
}

.stamp.next {
  right: 24px;
  color: var(--green);
  border-color: var(--green);

  transform: rotate(10deg);
}

.stamp.previous {
  left: 24px;
  color: var(--red);
  border-color: var(--red);

  transform: rotate(-10deg);
}

/* =========================================================
   CARD CONTENT
   ========================================================= */

.card-content {
  padding: 23px 25px;
}

.department {
  color: var(--purple);

  font-size: 13px;
  font-weight: bold;

  text-transform: uppercase;

  letter-spacing: 0.7px;

  margin-bottom: 7px;
}

.name {
  font-size: 29px;
  line-height: 1.05;

  font-weight: bold;

  margin-bottom: 6px;
}

.role {
  color: #555;

  font-size: 15px;

  margin-bottom: 17px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;

  margin-bottom: 17px;
}

.tag {
  background: var(--light-purple);
  color: var(--dark-purple);

  padding: 5px 9px;

  border-radius: 14px;

  font-size: 12px;
}

.availability {
  font-size: 14px;
  color: #555;

  line-height: 1.4;
}

.availability a {
  color: var(--purple);
  font-weight: bold;
  text-decoration: none;
}

.availability a:hover {
  text-decoration: underline;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.actions {
  width: min(420px, calc(100vw - 40px));

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;

  margin-top: 20px;
}

.action-btn {
  width: 62px;
  height: 62px;

  border-radius: 50%;

  border: 1px solid #ddd;

  background: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 27px;

  cursor: pointer;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.08);

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
}

.action-btn:hover {
  transform: translateY(-2px);

  box-shadow:
    0 8px 20px rgba(0,0,0,0.12);
}

.action-btn:active {
  transform: scale(0.94);
}

.pass {
  color: var(--red);
}

.like {
  color: var(--green);
}

/* =========================================================
   MATCH SCREEN
   ========================================================= */

.match-screen {
  position: fixed;

  inset: 0;

  background: rgba(250,250,250,0.98);

  z-index: 100;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 25px;
}

.match-screen.visible {
  display: flex;
}

.match-box {
  width: min(460px, 100%);

  background: white;

  border: 1px solid #ddd;
  border-radius: 20px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.12);

  padding: 32px;

  text-align: center;
}

.match-title {
  color: var(--purple);

  font-size: 15px;

  font-weight: bold;

  text-transform: uppercase;

  letter-spacing: 1px;

  margin-bottom: 12px;
}

.match-heading {
  font-size: 34px;

  font-weight: bold;

  margin-bottom: 10px;
}

.match-description {
  color: #666;

  font-size: 15px;

  line-height: 1.5;

  margin-bottom: 25px;
}

.match-photo {
  width: 130px;
  height: 130px;

  border-radius: 50%;

  object-fit: cover;

  margin-bottom: 18px;

  border: 4px solid var(--light-purple);
}

.meeting-btn {
  width: 100%;

  border: none;

  background: var(--purple);

  color: white;

  padding: 15px 20px;

  border-radius: 9px;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  margin-bottom: 11px;

  transition:
    background 0.15s ease,
    transform 0.15s ease;
}

.meeting-btn:hover {
  background: var(--dark-purple);
}

.meeting-btn:active {
  transform: scale(0.98);
}

.restart-btn {
  width: 100%;

  border: 1px solid #ccc;

  background: white;

  color: #444;

  padding: 13px 20px;

  border-radius: 9px;

  font-size: 15px;

  cursor: pointer;
}

.restart-btn:hover {
  background: #f5f5f5;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  header {
    padding: 0 18px;
  }

  .logo-text {
    font-size: 18px;
  }

  .logo-sub {
    display: none;
  }

  .sfsu-link {
    font-size: 13px;
  }

  main {
    padding-top: 18px;
  }

  .deck {
    height: 560px;
  }

  .photo-container {
    height: 290px;
  }

  .name {
    font-size: 27px;
  }

  .match-box {
    padding: 25px;
  }
}

</style>
</head>

<body>

<!-- =======================================================
     HEADER
     ======================================================= -->

<header>

  <div class="logo" id="logoButton">

    <div class="logo-mark">
      AC
    </div>

    <div>
      <div class="logo-text">
        After Class
      </div>

      <div class="logo-sub">
        SFSU Office Hours
      </div>
    </div>

  </div>

  <a
    class="sfsu-link"
    id="sfsuFacultyLink"
    href="https://faculty.sfsu.edu/atoz"
  >
    SFSU Faculty
  </a>

</header>


<!-- =======================================================
     MAIN
     ======================================================= -->

<main>

  <div class="top-line">

    <div class="title">
      Find a professor to talk to
    </div>

    <div
      class="counter"
      id="counter"
    >
      1 / 6
    </div>

  </div>


  <div
    class="deck"
    id="deck"
  ></div>


  <div class="actions">

    <button
      class="action-btn pass"
      id="passBtn"
      aria-label="Previous professor"
    >
      ✕
    </button>

    <button
      class="action-btn like"
      id="likeBtn"
      aria-label="Next professor"
    >
      ♡
    </button>

  </div>

</main>


<!-- =======================================================
     MATCH SCREEN
     ======================================================= -->

<div
  class="match-screen"
  id="matchScreen"
>

  <div class="match-box">

    <img
      class="match-photo"
      id="matchPhoto"
      src=""
      alt=""
    >

    <div class="match-title">
      It's a Match
    </div>

    <div
      class="match-heading"
      id="matchName"
    >
      Professor
    </div>

    <div
      class="match-description"
      id="matchDescription"
    >
      You found a professor whose office hours may be a good fit.
    </div>

    <button
      class="meeting-btn"
      id="meetingBtn"
    >
      Schedule a meeting
    </button>

    <button
      class="restart-btn"
      id="restartBtn"
    >
      Continue browsing
    </button>

  </div>

</div>


<script>

/* =========================================================
   PROFESSOR DATA
   ========================================================= */

const professors = [

  {
    name: "Lynn Mahoney",

    department: "University Administration",

    role: "President • San Francisco State University",

    photo: "pre.png",

    tags: [
      "Leadership",
      "Higher Education",
      "SFSU",
      "Student Success"
    ],

    availability:
      "Request a meeting with the President."
  },

  {
    name: "David Quintero",

    department: "Mechanical Engineering",

    role: "Associate Professor • Engineering",

    photo: "david.png",

    tags: [
      "Mechanical Engineering",
      "Robotics",
      "Design",
      "Engineering"
    ],

    availability:
      "Interested students can learn more about joining the lab."
  },

  {
    name: "Benjamin Sabey",

    department: "Music",

    role: "Faculty • Composition",

    photo: "ben.png",

    tags: [
      "Composition",
      "Music",
      "Contemporary Music",
      "Creativity"
    ],

    availability:
      "Book a meeting through Calendly."
  },

  {
    name: "Zakarias Grafilo",

    department: "Music",

    role: "Faculty • Chamber Music",

    photo: "zak.png",

    tags: [
      "Chamber Music",
      "Ensemble",
      "Performance",
      "Music"
    ],

    availability:
      "View faculty information and contact details."
  },

  {
    name: "Sybil Yang",

    department: "Business",

    role: "Faculty • Business",

    photo: "yang.png",

    tags: [
      "Business",
      "Management",
      "Organizations",
      "Strategy"
    ],

    availability:
      "Visit the faculty page for information."
  },

  {
    name: "Vera Klimkovsky",

    department: "Mathematics",

    role: "Faculty • Mathematics",

    photo: "vera.png",

    tags: [
      "Mathematics",
      "Problem Solving",
      "Theory",
      "Quantitative"
    ],

    availability:
      "View faculty information and contact details."
  }

];


/* =========================================================
   REAL LINKS
   ========================================================= */

const CALENDLY_LINKS = {

  "Lynn Mahoney":
    "https://president.sfsu.edu/request-presidents-attendance",

  "David Quintero":
    "https://www.careroboticslab.com/interested-students",

  "Benjamin Sabey":
    "https://calendly.com/bensabey",

  "Zakarias Grafilo":
    "https://music.sfsu.edu/people/zakarias-grafilo",

  "Sybil Yang":
    "https://faculty.sfsu.edu/~sybil",

  "Vera Klimkovsky":
    "https://cob.sfsu.edu/decision-sciences/directory/vera-klimkovsky"

};


/* =========================================================
   STATE
   ========================================================= */

let index = 0;

let currentCard = null;

let startX = 0;
let startY = 0;

let currentX = 0;

let dragging = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const deck =
  document.getElementById("deck");

const counter =
  document.getElementById("counter");

const passBtn =
  document.getElementById("passBtn");

const likeBtn =
  document.getElementById("likeBtn");

const matchScreen =
  document.getElementById("matchScreen");

const matchPhoto =
  document.getElementById("matchPhoto");

const matchName =
  document.getElementById("matchName");

const matchDescription =
  document.getElementById("matchDescription");

const meetingBtn =
  document.getElementById("meetingBtn");

const restartBtn =
  document.getElementById("restartBtn");

const logoButton =
  document.getElementById("logoButton");

const sfsuFacultyLink =
  document.getElementById("sfsuFacultyLink");


/* =========================================================
   HEADER ACTIONS
   ========================================================= */

logoButton.onclick = function() {

  window.location.reload();

};


sfsuFacultyLink.onclick = function(e) {

  e.preventDefault();

  window.location.href =
    "https://faculty.sfsu.edu/atoz";

};


/* =========================================================
   CREATE CARD
   ========================================================= */

function createCard(p, preview) {

  const card =
    document.createElement("div");

  card.className =
    preview
      ? "card next-preview"
      : "card current";


  const link =
    CALENDLY_LINKS[p.name];


  let availabilityHTML = p.availability;


  if (link) {

    availabilityHTML = `
      <a
        href="${link}"
        target="_blank"
        rel="noopener noreferrer"
        class="availability-link"
      >
        ${p.availability}
      </a>
    `;

  }


  card.innerHTML = `

    <div class="photo-container">

      <img
        class="photo"
        src="${p.photo}"
        alt="${p.name}"
        draggable="false"
      >

      <div class="stamp next">
        NEXT
      </div>

      <div class="stamp previous">
        PREVIOUS
      </div>

    </div>


    <div class="card-content">

      <div class="department">
        ${p.department}
      </div>

      <div class="name">
        ${p.name}
      </div>

      <div class="role">
        ${p.role}
      </div>

      <div class="tags">

        ${p.tags
          .map(tag => `
            <span class="tag">
              ${tag}
            </span>
          `)
          .join("")}

      </div>

      <div class="availability">
        ${availabilityHTML}
      </div>

    </div>

  `;


  /*
   * Prevent clicking the profile link
   * from starting a card drag.
   */

  const availabilityLink =
    card.querySelector(".availability-link");


  if (availabilityLink) {

    availabilityLink.addEventListener(
      "pointerdown",
      function(e) {
        e.stopPropagation();
      }
    );

    availabilityLink.addEventListener(
      "click",
      function(e) {
        e.stopPropagation();
      }
    );

  }


  return card;

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  deck.innerHTML = "";

  counter.textContent =
    `${index + 1} / ${professors.length}`;


  /*
   * Always show the next professor
   * behind the current card.
   */

  const nextIndex =
    (index + 1) % professors.length;


  const nextCard =
    createCard(
      professors[nextIndex],
      true
    );


  deck.appendChild(nextCard);


  /*
   * Current professor
   */

  const card =
    createCard(
      professors[index],
      false
    );


  deck.appendChild(card);


  currentCard = card;

  attachDrag(card);

}


/* =========================================================
   DRAG / SWIPE
   ========================================================= */

function attachDrag(card) {

  card.addEventListener(
    "pointerdown",
    pointerDown
  );

  card.addEventListener(
    "pointermove",
    pointerMove
  );

  card.addEventListener(
    "pointerup",
    pointerUp
  );

  card.addEventListener(
    "pointercancel",
    pointerUp
  );

}


/* =========================================================
   POINTER DOWN
   ========================================================= */

function pointerDown(e) {

  if (!currentCard) {
    return;
  }

  dragging = true;

  startX = e.clientX;
  startY = e.clientY;

  currentX = 0;

  currentCard.style.transition =
    "none";

  currentCard.setPointerCapture(
    e.pointerId
  );

}


/* =========================================================
   POINTER MOVE
   ========================================================= */

function pointerMove(e) {

  if (!dragging || !currentCard) {
    return;
  }

  currentX =
    e.clientX - startX;

  const currentY =
    e.clientY - startY;


  /*
   * Rotation follows horizontal movement.
   */

  const rotation =
    currentX * 0.04;


  currentCard.style.transform =
    `translateX(${currentX}px)
     translateY(${currentY * 0.15}px)
     rotate(${rotation}deg)`;


  /*
   * Show the appropriate stamp.
   */

  const nextStamp =
    currentCard.querySelector(".stamp.next");

  const previousStamp =
    currentCard.querySelector(".stamp.previous");


  if (currentX > 20) {

    nextStamp.style.opacity =
      Math.min(currentX / 100, 1);

    previousStamp.style.opacity = 0;

  }

  else if (currentX < -20) {

    previousStamp.style.opacity =
      Math.min(Math.abs(currentX) / 100, 1);

    nextStamp.style.opacity = 0;

  }

  else {

    nextStamp.style.opacity = 0;

    previousStamp.style.opacity = 0;

  }

}


/* =========================================================
   POINTER UP
   ========================================================= */

function pointerUp(e) {

  if (!dragging || !currentCard) {
    return;
  }

  dragging = false;


  const threshold = 110;


  /*
   * RIGHT
   *
   * Right swipe means NEXT.
   * It also opens the Match screen.
   */

  if (currentX > threshold) {

    const selectedProfessor =
      professors[index];


    swipe(
      "right",
      currentCard,
      selectedProfessor
    );

    return;

  }


  /*
   * LEFT
   *
   * Left swipe means PREVIOUS.
   */

  if (currentX < -threshold) {

    swipe(
      "left",
      currentCard
    );

    return;

  }


  /*
   * Not enough movement.
   * Return the card to center.
   */

  currentCard.style.transition =
    "transform 0.25s ease";

  currentCard.style.transform =
    "translateX(0) translateY(0) rotate(0deg)";


  const nextStamp =
    currentCard.querySelector(".stamp.next");

  const previousStamp =
    currentCard.querySelector(".stamp.previous");


  nextStamp.style.opacity = 0;

  previousStamp.style.opacity = 0;

}


/* =========================================================
   SWIPE
   ========================================================= */

function swipe(
  direction,
  card,
  selectedProfessor = null
) {

  if (!card) {
    return;
  }


  /*
   * Animate card away.
   */

  card.style.transition =
    "transform 0.3s ease, opacity 0.3s ease";


  const distance =
    direction === "right"
      ? window.innerWidth + 300
      : -window.innerWidth - 300;


  const rotation =
    direction === "right"
      ? 18
      : -18;


  card.style.transform =
    `translateX(${distance}px)
     rotate(${rotation}deg)`;


  card.style.opacity = 0;


  setTimeout(function() {


    /*
     * RIGHT
     *
     * Advance to next professor,
     * then show Match screen.
     */

    if (direction === "right") {

      index =
        (index + 1) %
        professors.length;


      render();


      showMatch(
        selectedProfessor
      );


      return;

    }


    /*
     * LEFT
     *
     * Go to previous professor.
     */

    index =
      (index - 1 + professors.length) %
      professors.length;


    render();


  }, 300);

}


/* =========================================================
   MATCH SCREEN
   ========================================================= */

let matchedProfessor = null;


function showMatch(professor) {

  if (!professor) {
    return;
  }


  matchedProfessor =
    professor;


  matchPhoto.src =
    professor.photo;

  matchPhoto.alt =
    professor.name;


  matchName.textContent =
    professor.name;


  matchDescription.textContent =
    `${professor.role}. You can use the link below to learn more or request a meeting.`;


  matchScreen.classList.add(
    "visible"
  );

}


/* =========================================================
   SCHEDULE MEETING
   ========================================================= */

meetingBtn.onclick = function() {

  if (!matchedProfessor) {
    return;
  }


  const link =
    CALENDLY_LINKS[
      matchedProfessor.name
    ];


  if (!link) {
    return;
  }


  window.location.href = link;

};


/* =========================================================
   CONTINUE BROWSING
   ========================================================= */

restartBtn.onclick = function() {

  matchScreen.classList.remove(
    "visible"
  );


  matchedProfessor = null;


  render();

};


/* =========================================================
   BUTTON: PREVIOUS
   ========================================================= */

passBtn.onclick = function() {

  if (!currentCard) {
    return;
  }


  swipe(
    "left",
    currentCard
  );

};


/* =========================================================
   BUTTON: NEXT / MATCH
   ========================================================= */

likeBtn.onclick = function() {

  if (!currentCard) {
    return;
  }


  const selectedProfessor =
    professors[index];


  swipe(
    "right",
    currentCard,
    selectedProfessor
  );

};


/* =========================================================
   INITIAL RENDER
   ========================================================= */

render();

</script>

</body>
</html>
